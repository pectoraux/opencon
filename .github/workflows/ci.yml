# OpenCon CI — NET-W001 architecture enforcement.
#
# Work order ref: NET-W001 §4.8 (Architecture enforcement):
#   "The checks may be simple and deterministic in this work item;
#    they must be enforceable in CI."
#
# This workflow runs the reproducible verification pipeline
# (`bun run verify` = typecheck + arch:check + tests) on every push
# and every pull request targeting `main`, so the architecture/
# dependency checks are enforced before merge.
#
# The architecture check (`bun run arch:check`) is an explicit,
# separate step so a dependency-direction / adapter-isolation
# violation fails CI independently of the test suite (AC-02, AC-07).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck + arch:check + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Architecture check (dependency direction + adapter isolation)
        # NET-W001 §4.8 — enforceable in CI. Exits 1 on any violation.
        run: bun run arch:check

      - name: Test suite
        run: bun test
